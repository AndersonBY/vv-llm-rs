[package]
name = "vv-llm"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "Rust implementation surface for vv-llm"
repository = "https://github.com/AndersonBY/vv-llm-rs"
homepage = "https://github.com/AndersonBY/vv-llm-rs"
documentation = "https://docs.rs/vv-llm"
readme = "../../README.md"
keywords = ["llm", "openai", "anthropic", "bedrock", "vertex"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "vv_llm"
path = "src/lib.rs"

[dependencies]
anthropic = "0.0.8"
aws-credential-types = "1.2.14"
aws-sdk-bedrockruntime = "1.131.0"
aws-smithy-types = "1.4.8"
async-openai = { version = "0.40.2", features = ["byot", "chat-completion", "embedding"] }
async-trait = "0.1"
base64 = "0.22"
futures-core = "0.3"
futures-util = "0.3"
jsonwebtoken = "10.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiktoken-rs = "0.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
